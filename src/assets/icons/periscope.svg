<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Ocean surface -->
  <rect x="0" y="80" width="128" height="48" rx="0" fill="#1a6fa8"/>
  <!-- Ocean wave bumps -->
  <ellipse cx="16" cy="80" rx="18" ry="6" fill="#1d7fc0"/>
  <ellipse cx="52" cy="80" rx="20" ry="6" fill="#1d7fc0"/>
  <ellipse cx="88" cy="80" rx="20" ry="6" fill="#1d7fc0"/>
  <ellipse cx="122" cy="80" rx="16" ry="6" fill="#1d7fc0"/>

  <!-- Periscope shaft (vertical tube) -->
  <rect x="48" y="30" width="14" height="52" rx="5" fill="#cc2222"/>
  <!-- Periscope horizontal arm (pointing left) -->
  <rect x="16" y="30" width="46" height="14" rx="5" fill="#cc2222"/>
  <!-- Periscope eyepiece cap (left end) -->
  <circle cx="16" cy="37" r="9" fill="#aa1111"/>
  <!-- Lens highlight -->
  <circle cx="13" cy="34" r="3" fill="#ffffff" opacity="0.5"/>
  <!-- Periscope top cap -->
  <rect x="44" y="22" width="22" height="10" rx="5" fill="#aa1111"/>
</svg>


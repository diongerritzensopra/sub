    <!-- Periscope shaft (extends from bottom) -->
    <rect x="56" y="95" width="11" height="30" rx="5" fill="#cc2222"/>
    <!-- Periscope arm -->
    <rect x="40" y="94" width="27" height="11" rx="5" fill="#cc2222"/>
    <!-- Periscope eyepiece -->
    <circle cx="40" cy="99" r="5" fill="#ffffff"/>

    <!-- Separate circle stroke to hide periscope sticking out -->

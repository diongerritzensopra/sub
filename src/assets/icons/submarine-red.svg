<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Ocean -->
  <rect x="0" y="82" width="128" height="46" fill="#1a6fa8"/>
  <!-- Wave bumps -->
  <ellipse cx="14"  cy="82" rx="16" ry="5" fill="#1d7fc0"/>
  <ellipse cx="48"  cy="82" rx="22" ry="5" fill="#1d7fc0"/>
  <ellipse cx="88"  cy="82" rx="22" ry="5" fill="#1d7fc0"/>
  <ellipse cx="120" cy="82" rx="14" ry="5" fill="#1d7fc0"/>

  <!-- Submarine hull -->
  <ellipse cx="64" cy="88" rx="54" ry="18" fill="#cc2222"/>
  <!-- Hull shading top stripe -->
  <ellipse cx="64" cy="80" rx="54" ry="10" fill="#dd3333"/>

  <!-- Conning tower (sail) -->
  <rect x="50" y="58" width="28" height="26" rx="6" fill="#aa1111"/>
  <!-- Tower top rounded -->
  <ellipse cx="64" cy="58" rx="14" ry="6" fill="#bb1111"/>

  <!-- Periscope shaft -->
  <rect x="59" y="28" width="10" height="34" rx="4" fill="#cc2222"/>
  <!-- Periscope horizontal arm (pointing left) -->
  <rect x="22" y="28" width="41" height="10" rx="4" fill="#cc2222"/>
  <!-- Periscope eyepiece -->
  <circle cx="22" cy="33" r="7" fill="#aa1111"/>
  <circle cx="19" cy="30" r="2.5" fill="#ffffff" opacity="0.5"/>
  <!-- Periscope top cap -->
  <rect x="55" y="21" width="18" height="9" rx="4" fill="#aa1111"/>

  <!-- Porthole -->
  <circle cx="80" cy="88" r="7" fill="#1a6fa8" stroke="#aa1111" stroke-width="2.5"/>
  <circle cx="78" cy="86" r="2" fill="#ffffff" opacity="0.3"/>

  <!-- Propeller blades -->
  <ellipse cx="113" cy="84" rx="5" ry="10" fill="#881111" transform="rotate(-30 113 84)"/>
  <ellipse cx="113" cy="84" rx="5" ry="10" fill="#881111" transform="rotate(30 113 84)"/>
  <circle  cx="113" cy="84" r="4" fill="#aa1111"/>
</svg>


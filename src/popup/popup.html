<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>sub</title>
    <link href="popup.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="header-content">
          <h1>sub</h1>
          <button id="btn-scrape" title="Refresh timesheet data" type="button">
            🔄
          </button>
        </div>
      </header>

      <main>
        <section id="status-section">
          <p id="status-message">
            Klik op het vernieuwingspictogram om te beginnen.
          </p>
          <button
            aria-label="Melding sluiten"
            hidden
            id="btn-status-dismiss"
            title="Sluiten"
            type="button"
          >
            ×
          </button>
        </section>

        <section id="schedules-section">
          <h2>Projectschema's</h2>
          <button disabled id="btn-add-schedule" type="button">
            Nieuw schema
          </button>
          <button disabled id="btn-apply-schedules" type="button">
            Alles toepassen
          </button>
          <p id="schedules-empty">Nog geen schema's opgeslagen.</p>
          <ul
            aria-label="Selecteerbare projectschema's"
            hidden
            id="schedules-list"
          ></ul>
        </section>

        <section hidden id="schedule-form-section">
          <h2 id="schedule-form-title">Nieuw schema</h2>
          <form id="schedule-form">
            <div class="form-group">
              <label for="schedule-label">Naam</label>
              <input id="schedule-label" required type="text" />
            </div>
            <div class="form-group">
              <label for="schedule-project">Project</label>
              <select id="schedule-project" required>
                <option value="">-- Selecteer project --</option>
              </select>
            </div>
            <fieldset class="weekday-hours">
              <legend>Uren per dag</legend>
              <div class="weekday-inputs">
                <div class="weekday-input">
                  <label for="hours-monday">Maandag</label>
                  <input
                    id="hours-monday"
                    min="0"
                    step="0.5"
                    type="number"
                    value="0"
                  />
                </div>
                <div class="weekday-input">
                  <label for="hours-tuesday">Dinsdag</label>
                  <input
                    id="hours-tuesday"
                    min="0"
                    step="0.5"
                    type="number"
                    value="0"
                  />
                </div>
                <div class="weekday-input">
                  <label for="hours-wednesday">Woensdag</label>
                  <input
                    id="hours-wednesday"
                    min="0"
                    step="0.5"
                    type="number"
                    value="0"
                  />
                </div>
                <div class="weekday-input">
                  <label for="hours-thursday">Donderdag</label>
                  <input
                    id="hours-thursday"
                    min="0"
                    step="0.5"
                    type="number"
                    value="0"
                  />
                </div>
                <div class="weekday-input">
                  <label for="hours-friday">Vrijdag</label>
                  <input
                    id="hours-friday"
                    min="0"
                    step="0.5"
                    type="number"
                    value="0"
                  />
                </div>
                <div class="weekday-input">
                  <label for="hours-saturday">Zaterdag</label>
                  <input
                    id="hours-saturday"
                    min="0"
                    step="0.5"
                    type="number"
                    value="0"
                  />
                </div>
                <div class="weekday-input">
                  <label for="hours-sunday">Zondag</label>
                  <input
                    id="hours-sunday"
                    min="0"
                    step="0.5"
                    type="number"
                    value="0"
                  />
                </div>
              </div>
            </fieldset>
            <div class="form-actions">
              <button type="submit">Opslaan</button>
              <button id="schedule-form-cancel" type="button">Annuleren</button>
            </div>
          </form>
        </section>

        <section hidden id="summary-section">
          <h2>Timesheet overzicht</h2>
          <ul id="summary-list">
            <li><strong>Periode:</strong> <span id="period-value">-</span></li>
            <li>
              <strong>Projecten:</strong>
              <ul class="project-list" id="projects-value">
                <li>-</li>
              </ul>
            </li>
            <li>
              <strong>Uren gewerkt:</strong>
              <span id="worked-hours-value">-</span>
            </li>
            <li>
              <strong>Uren uit te voeren:</strong>
              <span id="to-be-performed-hours-value">-</span>
            </li>
          </ul>
          <p class="subtle-indicator" hidden id="scrape-status"></p>
          <p class="subtle-indicator" hidden id="data-origin-indicator"></p>
        </section>
      </main>
    </div>

    <script src="popup.ts" type="module"></script>
  </body>
</html>
